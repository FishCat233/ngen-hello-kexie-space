services:
  ngen-hello-kexie-space:
    image: ngen-hello-kexie-space:latest
    container_name: ngen-hello-kexie-space
    ports:
      - "8080:80"
    restart: unless-stopped
    # 可选：健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.2
    container_name: ngen-hello-kexie-space-pocketbase
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ../pocketbase/pb_migrations:/pb_migrations
    command: ["--migrationsDir", "/pb_migrations"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
