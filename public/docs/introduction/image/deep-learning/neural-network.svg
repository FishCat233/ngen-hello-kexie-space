<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #333; }
    .label { font-size: 14px; font-weight: 600; fill: #04080C; }
    .node-input { fill: #5CB8D9; }
    .node-hidden { fill: #4DB8B6; }
    .node-output { fill: #5CB8D9; }
    .edge { stroke: #CCCCCC; stroke-width: 0.8; fill: none; }
  </style>

  <!-- Input layer -->
  <text x="40" y="20" class="label" text-anchor="middle">输入层</text>
  <circle cx="40" cy="70" r="14" class="node-input"/>
  <circle cx="40" cy="110" r="14" class="node-input"/>
  <circle cx="40" cy="150" r="14" class="node-input"/>
  <circle cx="40" cy="190" r="14" class="node-input"/>
  <text x="40" y="230" text-anchor="middle" font-size="11">像素 / 词向量 / 特征</text>

  <!-- Hidden layer 1 -->
  <text x="160" y="20" class="label" text-anchor="middle">隐藏层 1</text>
  <circle cx="160" cy="54" r="14" class="node-hidden"/>
  <circle cx="160" cy="92" r="14" class="node-hidden"/>
  <circle cx="160" cy="130" r="14" class="node-hidden"/>
  <circle cx="160" cy="168" r="14" class="node-hidden"/>
  <circle cx="160" cy="206" r="14" class="node-hidden"/>

  <!-- Hidden layer 2 -->
  <text x="280" y="20" class="label" text-anchor="middle">隐藏层 2</text>
  <circle cx="280" cy="54" r="14" class="node-hidden"/>
  <circle cx="280" cy="92" r="14" class="node-hidden"/>
  <circle cx="280" cy="130" r="14" class="node-hidden"/>
  <circle cx="280" cy="168" r="14" class="node-hidden"/>
  <circle cx="280" cy="206" r="14" class="node-hidden"/>

  <!-- Hidden layer 3 -->
  <text x="400" y="20" class="label" text-anchor="middle">隐藏层 3</text>
  <circle cx="400" cy="70" r="14" class="node-hidden"/>
  <circle cx="400" cy="110" r="14" class="node-hidden"/>
  <circle cx="400" cy="150" r="14" class="node-hidden"/>
  <circle cx="400" cy="190" r="14" class="node-hidden"/>

  <!-- Output layer -->
  <text x="520" y="20" class="label" text-anchor="middle">输出层</text>
  <circle cx="520" cy="80" r="14" class="node-output"/>
  <circle cx="520" cy="130" r="14" class="node-output"/>
  <circle cx="520" cy="180" r="14" class="node-output"/>
  <text x="520" y="230" text-anchor="middle" font-size="11">分类 / 预测 / 生成</text>

  <!-- Edges: input → hidden1 (sampled subset for visual clarity) -->
  <g class="edge">
    <!-- Input→H1 -->
    <line x1="54" y1="70" x2="146" y2="54"/><line x1="54" y1="70" x2="146" y2="92"/><line x1="54" y1="70" x2="146" y2="130"/><line x1="54" y1="70" x2="146" y2="168"/><line x1="54" y1="70" x2="146" y2="206"/>
    <line x1="54" y1="110" x2="146" y2="54"/><line x1="54" y1="110" x2="146" y2="92"/><line x1="54" y1="110" x2="146" y2="130"/><line x1="54" y1="110" x2="146" y2="168"/><line x1="54" y1="110" x2="146" y2="206"/>
    <line x1="54" y1="150" x2="146" y2="54"/><line x1="54" y1="150" x2="146" y2="92"/><line x1="54" y1="150" x2="146" y2="130"/><line x1="54" y1="150" x2="146" y2="168"/><line x1="54" y1="150" x2="146" y2="206"/>
    <line x1="54" y1="190" x2="146" y2="54"/><line x1="54" y1="190" x2="146" y2="92"/><line x1="54" y1="190" x2="146" y2="130"/><line x1="54" y1="190" x2="146" y2="168"/><line x1="54" y1="190" x2="146" y2="206"/>
    <!-- H1→H2 -->
    <line x1="174" y1="54" x2="266" y2="54"/><line x1="174" y1="54" x2="266" y2="92"/><line x1="174" y1="54" x2="266" y2="130"/><line x1="174" y1="54" x2="266" y2="168"/><line x1="174" y1="54" x2="266" y2="206"/>
    <line x1="174" y1="92" x2="266" y2="54"/><line x1="174" y1="92" x2="266" y2="92"/><line x1="174" y1="92" x2="266" y2="130"/><line x1="174" y1="92" x2="266" y2="168"/><line x1="174" y1="92" x2="266" y2="206"/>
    <line x1="174" y1="130" x2="266" y2="54"/><line x1="174" y1="130" x2="266" y2="92"/><line x1="174" y1="130" x2="266" y2="130"/><line x1="174" y1="130" x2="266" y2="168"/><line x1="174" y1="130" x2="266" y2="206"/>
    <line x1="174" y1="168" x2="266" y2="54"/><line x1="174" y1="168" x2="266" y2="92"/><line x1="174" y1="168" x2="266" y2="130"/><line x1="174" y1="168" x2="266" y2="168"/><line x1="174" y1="168" x2="266" y2="206"/>
    <line x1="174" y1="206" x2="266" y2="54"/><line x1="174" y1="206" x2="266" y2="92"/><line x1="174" y1="206" x2="266" y2="130"/><line x1="174" y1="206" x2="266" y2="168"/><line x1="174" y1="206" x2="266" y2="206"/>
    <!-- H2→H3 -->
    <line x1="294" y1="54" x2="386" y2="70"/><line x1="294" y1="54" x2="386" y2="110"/><line x1="294" y1="54" x2="386" y2="150"/><line x1="294" y1="54" x2="386" y2="190"/>
    <line x1="294" y1="92" x2="386" y2="70"/><line x1="294" y1="92" x2="386" y2="110"/><line x1="294" y1="92" x2="386" y2="150"/><line x1="294" y1="92" x2="386" y2="190"/>
    <line x1="294" y1="130" x2="386" y2="70"/><line x1="294" y1="130" x2="386" y2="110"/><line x1="294" y1="130" x2="386" y2="150"/><line x1="294" y1="130" x2="386" y2="190"/>
    <line x1="294" y1="168" x2="386" y2="70"/><line x1="294" y1="168" x2="386" y2="110"/><line x1="294" y1="168" x2="386" y2="150"/><line x1="294" y1="168" x2="386" y2="190"/>
    <line x1="294" y1="206" x2="386" y2="70"/><line x1="294" y1="206" x2="386" y2="110"/><line x1="294" y1="206" x2="386" y2="150"/><line x1="294" y1="206" x2="386" y2="190"/>
    <!-- H3→Output -->
    <line x1="414" y1="70" x2="506" y2="80"/><line x1="414" y1="70" x2="506" y2="130"/><line x1="414" y1="70" x2="506" y2="180"/>
    <line x1="414" y1="110" x2="506" y2="80"/><line x1="414" y1="110" x2="506" y2="130"/><line x1="414" y1="110" x2="506" y2="180"/>
    <line x1="414" y1="150" x2="506" y2="80"/><line x1="414" y1="150" x2="506" y2="130"/><line x1="414" y1="150" x2="506" y2="180"/>
    <line x1="414" y1="190" x2="506" y2="80"/><line x1="414" y1="190" x2="506" y2="130"/><line x1="414" y1="190" x2="506" y2="180"/>
  </g>

  <!-- Depth annotation -->
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="#999">层数越多，网络越"深"——这就是"深度"的由来</text>
</svg>
